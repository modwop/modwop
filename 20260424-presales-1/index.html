    <script>
      function updateTicketingLinks(targetIsoDate) {
          try {
              const deadline = new Date(targetIsoDate);
              const now = new Date();
              const presaleEl = document.getElementById('2024-04-24-buy-presales');
              const presaleEl2 = document.getElementById('2024-04-24-buy-presales-form');
              const doorEl = document.getElementById('2024-04-24-buy-door');
              const doorEl2 = document.getElementById('2024-04-24-buy-door2');
              if (now >= deadline) {
                  if (presaleEl) presaleEl.style.display = 'none';
                  if (presaleEl2) presaleEl2.style.display = 'none';
                  if (doorEl) doorEl.style.display = 'block';
                  if (doorEl2) doorEl2.style.display = 'block';
              } else {
                  if (presaleEl) presaleEl.style.display = 'block';
                  if (presaleEl2) presaleEl2.style.display = 'block';
                  if (doorEl) doorEl.style.display = 'none';
                  if (doorEl2) doorEl2.style.display = 'none';
              }
          } catch (e) {
              console.error("Timer script error:", e);
          }
      }
      document.addEventListener('nextEventLoaded', function() {
        updateTicketingLinks("2026-04-24T14:00:00-05:00");
      });
    </script>
