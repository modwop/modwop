      <div id="next-event"></div><script src="/load-next-event.js?v=1.6"></script>
    </div>
    <script>
      function updateTicketingLinks2(targetIsoDate) {
          try {
              const deadline = new Date(targetIsoDate);
              const now = new Date();
              const presaleEl = document.getElementById('modwop-2026-11-07-buy-presales');
              const doorEl = document.getElementById('modwop-2024-11-07-buy-door');
              const linkEl = document.getElementById('modwop-2026-11-07-buy-link');
              if (now >= deadline) {
                  if (linkEl) {
                      linkEl.removeAttribute('href');
                      linkEl.style.cursor = 'default';
                      linkEl.onclick = function(e) { e.preventDefault(); return false; };
                  }
                  if (presaleEl) presaleEl.style.display = 'none';
                  if (doorEl) doorEl.style.display = 'block';
              } else {
                  if (presaleEl) presaleEl.style.display = 'block';
                  if (doorEl) doorEl.style.display = 'none';
              }
          } catch (e) {
              console.error("Timer script error:", e);
          }
      }
      window.addEventListener('DOMContentLoaded', function() {
          updateTicketingLinks2("2026-11-07T14:00:00-05:00");
      });
    </script>
    <script>
      document.addEventListener('click', function(event) {
          const element = event.target.closest('.reveal-text');
          if (element) {
              const address = document.getElementById(element.id + '-address');
              if (address) {
                  element.style.display = 'none';
                  address.style.display = 'block';
              }
          }
      });
    </script>
